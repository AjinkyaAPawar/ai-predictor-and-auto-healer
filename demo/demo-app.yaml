# Demo application for showcasing AI Predictor & Auto-Healer capabilities
# This creates intentional problems that the healer will detect and fix
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
# Realistic microservice stack (frontend + APIs) with controlled failure modes.
# Images are deliberately minimal (busybox) to keep the demo lightweight/offline-friendly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-pages
  namespace: demo-app
data:
  index.html: |
    <html>
      <head><title>Demo Shop</title></head>
      <body>
        <h2>Demo Shop</h2>
        <p>frontend=ok</p>
        <ul>
          <li>/api/orders</li>
          <li>/api/payments</li>
          <li>/api/recommendations</li>
        </ul>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo-app
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && cp /config/index.html /www/index.html;
              echo "storefront started";
              httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: demo-pages
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: demo-app
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Orders API (stable)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: demo-app
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www;
              while true; do
                cat > /www/index.html <<'EOF'
                orders-api=ok
                EOF
                httpd -f -p 8081 -h /www
              done
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: demo-app
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 80
      targetPort: 8081
---
# Failure-mode: Payments API CPU ramp (triggers predictor + scale-up)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: demo-app
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "payments-api starting";
              i=0;
              while true; do
                i=$((i+1));
                echo "cpu ramp tick=$i";
                # ramp: add more workers over time
                dd if=/dev/zero of=/dev/null &
                if [ $((i%3)) -eq 0 ]; then dd if=/dev/zero of=/dev/null & fi
                if [ $((i%5)) -eq 0 ]; then dd if=/dev/zero of=/dev/null & fi
                sleep 3;
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "300m"
              memory: "96Mi"
---
# Failure-mode: Recommendation worker memory leak (uses tmpfs: /dev/shm)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations-worker
  namespace: demo-app
  labels:
    app.kubernetes.io/name: recommendations-worker
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendations-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendations-worker
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "recommendations-worker simulating memory leak";
              n=0;
              while true; do
                n=$((n+1));
                dd if=/dev/zero of=/dev/shm/leak_${n}.bin bs=1M count=4 2>/dev/null || true;
                sleep 8;
              done
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
---
# Failure-mode: log writer fills /tmp (triggers cleanup)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-writer
  namespace: demo-app
  labels:
    app.kubernetes.io/name: log-writer
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-writer
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "log-writer filling /tmp";
              while true; do
                dd if=/dev/zero of=/tmp/app_$(date +%s).log bs=1M count=5 2>/dev/null || true;
                sleep 12;
              done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
---
# Failure-mode: DNS misconfiguration (triggers DNS checks)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-broken
  namespace: demo-app
  labels:
    app.kubernetes.io/name: dns-broken
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dns-broken
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dns-broken
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: worker
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.2.3.4
        searches:
          - demo-app.svc.cluster.local
        options:
          - name: ndots
            value: "2"
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "dns-broken running with invalid resolver";
              while true; do sleep 30; done
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
---
# Failure-mode: crash loop (triggers restart pattern analysis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo-app
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: demo-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "checkout will crash repeatedly";
              sleep 25;
              exit 1
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
