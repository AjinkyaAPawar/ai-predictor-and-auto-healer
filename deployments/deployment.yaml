apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-healer
  namespace: healer-system
  labels:
    app: k8s-healer
    app.kubernetes.io/name: k8s-ai-healer
    app.kubernetes.io/version: "4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-healer
  template:
    metadata:
      labels:
        app: k8s-healer
        app.kubernetes.io/name: k8s-ai-healer
    spec:
      serviceAccountName: k8s-healer
      # Ensures the pod is scheduled and won't be evicted due to resource pressure
      priorityClassName: system-cluster-critical
      containers:
      - name: healer
        image: k8s-healer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: HEALER_PORT
          value: "8080"
        - name: HEALER_DRY_RUN
          value: "false"
        - name: HEALER_LOG_LEVEL
          value: "info"
        - name: HEALER_CHECK_INTERVAL
          value: "30"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-healer
  namespace: healer-system
  labels:
    app: k8s-healer
    app.kubernetes.io/name: k8s-ai-healer
spec:
  selector:
    app: k8s-healer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
