# K8s AI Healer — All-in-One Local Installation Manifest
# ─────────────────────────────────────────────────────────────────────────────
# PRE-REQUISITE: Build the image locally first:
#
#   docker build -t k8s-healer:latest .
#
# For minikube — load the image so the cluster can see it:
#   minikube image load k8s-healer:latest
#
# For kind:
#   kind load docker-image k8s-healer:latest
#
# For other clusters — push to your internal registry and update the
# `image:` field below to match (e.g. registry.local/k8s-healer:latest).
#
# Apply with:
#   kubectl apply -f deployments/install.yaml
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: healer-system
  labels:
    app.kubernetes.io/name: k8s-ai-healer
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-healer
  namespace: healer-system
  labels:
    app.kubernetes.io/name: k8s-ai-healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-healer
  labels:
    app.kubernetes.io/name: k8s-ai-healer
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-healer
  labels:
    app.kubernetes.io/name: k8s-ai-healer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-healer
subjects:
- kind: ServiceAccount
  name: k8s-healer
  namespace: healer-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-healer
  namespace: healer-system
  labels:
    app: k8s-healer
    app.kubernetes.io/name: k8s-ai-healer
    app.kubernetes.io/version: "4.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-healer
  template:
    metadata:
      labels:
        app: k8s-healer
        app.kubernetes.io/name: k8s-ai-healer
    spec:
      serviceAccountName: k8s-healer
      containers:
      - name: healer
        # ── LOCAL IMAGE ────────────────────────────────────────────────────
        # Built from this repo with: docker build -t k8s-healer:latest .
        # Change to your internal registry if needed:
        #   image: registry.yourcompany.com/k8s-healer:latest
        image: k8s-healer:latest
        # Never = only use locally present image (no external pull)
        imagePullPolicy: Never
        # ──────────────────────────────────────────────────────────────────
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: HEALER_PORT
          value: "8080"
        - name: HEALER_DRY_RUN
          value: "false"
        - name: HEALER_LOG_LEVEL
          value: "info"
        - name: HEALER_CHECK_INTERVAL
          value: "30"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-healer
  namespace: healer-system
  labels:
    app: k8s-healer
    app.kubernetes.io/name: k8s-ai-healer
spec:
  selector:
    app: k8s-healer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
