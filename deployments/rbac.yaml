apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-predictor-healer
  namespace: ai-healer-system
  labels:
    app.kubernetes.io/name: k8s-ai-healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-predictor-healer
  labels:
    app.kubernetes.io/name: k8s-ai-healer
rules:
# Core pod operations (list, watch, exec, delete for healing)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
# Pod exec - required for container health checks and auto-healing commands
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
# Pod logs - for diagnostics
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Events - for restart pattern analysis
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# Nodes - for node metrics collection
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Deployments - for auto-scaling healing actions
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
# ReplicaSets - required by deployment controller
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
# Metrics API - for CPU/memory data collection
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-predictor-healer
  labels:
    app.kubernetes.io/name: k8s-ai-healer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-predictor-healer
subjects:
- kind: ServiceAccount
  name: ai-predictor-healer
  namespace: ai-healer-system
